  <style>

    .shell{display:flex;min-height:100vh}.sidebar{width:246px;background:var(--navy);color:white;padding:25px 15px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{display:flex;align-items:center;gap:12px;padding:5px 9px}.brand-symbol{width:44px;height:44px;border-radius:14px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:19px;font-weight:900;letter-spacing:-2px}.brand b{font-size:18px;letter-spacing:.1px}.brand small{display:block;color:#b4c8e7;font-size:11px;margin-top:3px;letter-spacing:.7px;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{color:#cbdcf4;background:transparent;border:0;border-radius:10px;padding:13px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:600}.nav button svg{width:18px;height:18px;stroke:currentColor}.nav button.active,.nav button:hover{background:#2b4f84;color:#fff}.side-info{margin-top:auto;padding:14px;border:1px solid #45628b;border-radius:12px;color:#c2d2e7;font-size:12px;line-height:1.6}.side-info b{display:block;color:#fff;margin-bottom:3px}
    .main{flex:1;min-width:0;max-width:1600px;margin:0 auto;padding:35px 38px 60px}.heading{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:var(--blue);font-weight:800;margin-bottom:8px}h1{font-size:clamp(24px,3vw,31px);letter-spacing:-1.1px;line-height:1.1;margin:0 0 8px}h2{font-size:18px;margin:0 0 16px;letter-spacing:-.3px}h3{margin:0 0 5px;font-size:15px}.sub{color:var(--muted);margin:0;line-height:1.5}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,input,textarea{background:white;border:1px solid #d2dce9;border-radius:10px;padding:11px 12px;color:var(--ink);outline:none;max-width:100%}select:focus,input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2468d61c}textarea{width:100%;min-height:85px;resize:vertical}.btn{padding:11px 15px;border-radius:10px;border:1px solid var(--line);font-weight:700;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;min-height:42px}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.dark{background:var(--navy);border-color:var(--navy);color:white}.btn.danger{color:var(--red);border-color:#f0cdd2}.btn.tiny{font-size:12px;padding:8px 10px;min-height:34px}.btn.icon-btn{width:40px;padding:8px}
    .stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat{background:#fff;padding:18px 20px;border-radius:15px;border:1px solid var(--line);box-shadow:var(--shadow)}.stat .stat-label{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-weight:600;font-size:12px}.stat strong{display:block;font-size:29px;line-height:1.15;margin:13px 0 5px;letter-spacing:-.8px}.stat small{font-size:11px;color:var(--muted)}.stat .spot{height:9px;width:9px;background:var(--blue);border-radius:99px;display:inline-block;margin-top:3px}.stat.warn .spot{background:#e39b26}.stat.bad .spot{background:#d2424e}.stat.ok .spot{background:#249b71}
    .notice{background:#edf4ff;border:1px solid #cfe0fb;border-radius:13px;padding:14px 17px;display:flex;align-items:flex-start;gap:12px;color:#25446f;margin-bottom:20px;line-height:1.5}.notice.warning{background:#fff8e9;border-color:#ffe3a1;color:#805408}.notice strong{display:block;margin-bottom:2px}.notice p{margin:0;font-size:13px}.notice span.symbol{font-size:19px}.section-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:16px}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:var(--shadow);min-width:0}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.panel-top h2{margin:0}.tiny-link{color:var(--blue);font-weight:700;background:none;border:0;padding:5px}.clean-list{list-style:none;margin:0;padding:0;display:grid;gap:0}.clean-list li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px}.clean-list li:last-child{border:0;padding-bottom:2px}.line-info{min-width:0}.line-info b{display:block;font-size:13px;line-height:1.4}.line-info small{display:block;color:var(--muted);margin-top:3px;line-height:1.3}.qty{font-size:16px;font-weight:850;white-space:nowrap}.status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 9px;font-weight:800;font-size:11px;white-space:nowrap}.status.low{background:#fff0ef;color:#a32a35}.status.good{background:#e7f7ed;color:#19704b}.status.wait{background:#f0f2f6;color:#697689}.status.zero{background:#fff0ef;color:#a32a35}.empty{text-align:center;padding:34px 16px;color:var(--muted);line-height:1.55}.empty .big{font-size:30px;display:block;margin-bottom:10px}.toolbar{display:flex;gap:11px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-bottom:17px}.toolbar .search{flex:1;min-width:185px;max-width:430px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{background:white;border:1px solid var(--line);border-radius:99px;padding:8px 13px;font-size:12px;font-weight:750;color:var(--muted)}.filter.active{background:var(--pale);border-color:#acd0ff;color:#1b5cbd}.tablebox{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow)}.tr{display:grid;grid-template-columns:minmax(240px,1.8fr) 100px 104px 155px;gap:12px;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line)}.tr:last-child{border-bottom:0}.tr.head{background:#f9fbfe;color:var(--muted);font-size:11px;letter-spacing:.3px;text-transform:uppercase;font-weight:800}.tr .product b{display:block}.tr .product small{display:block;color:var(--muted);margin-top:4px}.tr .amount{font-size:18px;font-weight:850}.tr .amount small{font-size:11px;color:var(--muted);font-weight:600}.cell-actions{display:flex;gap:5px;justify-content:flex-end}.cell-actions .btn{padding:7px 10px}.muted{color:var(--muted)}.muted-sm{color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:grid;gap:6px;min-width:0}.field label{font-weight:750;font-size:12px;color:#475a76}.field input,.field select{width:100%}.field.full{grid-column:1/-1}.help{font-size:12px;color:var(--muted);line-height:1.5}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.kind-switch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:20px}.kind-switch button{border:1px solid var(--line);border-radius:10px;background:white;padding:12px 6px;font-size:12px;font-weight:800;color:#546780}.kind-switch button.selected{background:var(--pale);border-color:#8eb6f2;color:#165ec4}.card-limit{max-width:760px}.note-preview{background:#f7faff;border:1px solid var(--line);padding:12px 14px;border-radius:9px;color:#50647f;line-height:1.5;margin-top:14px}.table-scroll{overflow:auto}.history-row{display:grid;grid-template-columns:150px minmax(160px,1.5fr) minmax(110px,1fr) 80px;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}.history-row:last-child{border:0}.history-row.header-row{background:#f9fbfe;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:800}.history-row small{color:var(--muted);display:block;margin-top:4px;line-height:1.35}.history-row b{font-size:13px}.type{font-size:12px;font-weight:800}.type.entrada{color:var(--green)}.type.saida{color:var(--red)}.type.transferencia{color:var(--blue)}.type.contagem,.type.ajuste{color:#945a05}.catalog-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.catalog{padding:16px;border:1px solid var(--line);border-radius:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.catalog b{display:block;margin-bottom:6px}.catalog small{display:block;color:var(--muted);line-height:1.6}.catalog.archived{opacity:.55}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}.settings-actions{display:flex;flex-wrap:wrap;gap:10px}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:20px}
    dialog{border:0;border-radius:17px;padding:0;width:min(95vw,530px);box-shadow:0 22px 100px #001a3766;color:var(--ink)}dialog::backdrop{background:#0a193d99}.dialog-inner{padding:24px}.dialog-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}.dialog-title h2{margin:0}.dialog-close{font-size:22px;border:0;background:none;padding:3px 8px;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;padding:14px 17px;border-radius:11px;background:#153b70;color:#fff;font-weight:650;box-shadow:0 8px 25px #001d3966;display:none;z-index:99;max-width:360px}.toast.error{background:#9f2d36}.toast.show{display:block}
    @media(max-width:1110px){.sidebar{width:215px}.main{padding:30px 23px}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tr{grid-template-columns:minmax(185px,1fr) 78px 95px 130px;gap:8px}.section-grid{grid-template-columns:1fr}}
    @media(max-width:750px){.shell{display:block}.sidebar{height:auto;width:auto;position:static;padding:13px 13px 0;gap:9px}.brand{padding:4px 5px}.brand-symbol{width:36px;height:36px;font-size:16px;border-radius:11px}.brand b{font-size:16px}.brand small{font-size:9px}.nav{display:flex;overflow:auto;gap:4px;padding:6px 0 11px}.nav button{flex-shrink:0;padding:10px 12px;font-size:12px;gap:5px}.nav button svg{width:15px;height:15px}.side-info{display:none}.main{padding:23px 13px 50px}.heading{margin-bottom:19px}.controls{width:100%}.controls select{flex:1;min-width:0}.stat-grid{gap:9px;margin-bottom:15px}.stat{padding:15px}.stat strong{font-size:25px}.panel{padding:15px}.toolbar .search{max-width:none;width:100%}.tr.head{display:none}.tr{display:flex;flex-wrap:wrap;justify-content:space-between;padding:15px;gap:9px}.tr .product{width:100%}.tr .stock-amount{min-width:76px}.tr .cell-actions{margin-left:auto}.catalog-grid{grid-template-columns:1fr}.history-row{grid-template-columns:1fr 1fr;gap:7px}.history-row.header-row{display:none}.kind-switch{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{gap:12px}.section-grid{gap:12px}}
    @media print{.sidebar,.controls,.btn,.toolbar,.kind-switch,.notice,.form-actions,.footnote,.toast,dialog{display:none!important}.main{padding:0}.panel,.tablebox,.stat{box-shadow:none}.tr{break-inside:avoid}.tr.head{display:grid}}

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-symbol">GM</div><div><b>Gesso Mundial</b><small>Controle de estoque</small></div></div>
    <nav class="nav" id="nav">
      <button type="button" data-nav="painel" class="active">▦ &nbsp; Painel geral</button>
      <button type="button" data-nav="estoque">▤ &nbsp; Estoque</button>
      <button type="button" data-nav="movimentos">⇄ &nbsp; Movimentar</button>
      <button type="button" data-nav="historico">◷ &nbsp; Histórico</button>
      <button type="button" data-nav="produtos">▧ &nbsp; Produtos</button>
      <button type="button" data-nav="dados">⚙ &nbsp; Dados e backup</button>
    </nav>
    <div class="side-info"><b>Seus dados, no seu aparelho</b>Salve um backup regularmente. Esta versão funciona sem internet e não sincroniza entre celulares.</div>
  </aside>
  <main class="main">
    <div id="content"></div>
  </main>
</div>
<dialog id="productDialog"><div class="dialog-inner"><div class="dialog-title"><h2 id="dialogTitle">Produto</h2><button type="button" class="dialog-close" data-close aria-label="Fechar">×</button></div><form id="productForm"><input type="hidden" id="editId"><div class="form-grid"><div class="field full"><label for="pName">Nome do produto *</label><input required maxlength="120" id="pName" placeholder="Ex.: Placa de gesso"></div><div class="field"><label for="pCategory">Categoria *</label><select id="pCategory" required><option>Gesso</option><option>Portas</option><option>Argamassas</option><option>Acessórios</option><option>Outros</option></select></div><div class="field"><label for="pUnit">Unidade *</label><select id="pUnit"><option value="un">Unidade (un)</option><option value="saco">Saco</option><option value="barra">Barra</option><option value="m">Metro (m)</option><option value="cx">Caixa</option></select></div><div class="field"><label for="pPrice">Preço de venda (R$)</label><input id="pPrice" inputmode="decimal" placeholder="Ex.: 22,00"></div><div class="field"><label for="pMin">Alerta de estoque mínimo *</label><input id="pMin" type="number" min="0" step="1" required value="5"></div></div><p class="help">O preço é apenas referência de venda. O estoque mínimo deste produto vale para as duas unidades.</p><div class="form-actions"><button class="btn primary" type="submit">Salvar produto</button><button class="btn" type="button" data-close>Cancelar</button></div></form></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const DB_KEY='gesso_mundial_estoque_v1';
const BRANCHES=[{id:'pesqueira',name:'Filial Pesqueira – PE',short:'Pesqueira'},{id:'cajueiro',name:'Matriz Cajueiro Seco – PE',short:'Cajueiro Seco'}];
const $=(id)=>document.getElementById(id);
const escapeHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n)=>n===null||n===undefined?'Não informado':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
const fmtDate=(iso)=>new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);
const branchName=(id)=>BRANCHES.find(b=>b.id===id)?.short||id;
const initCatalog=()=>{
 const list=[];let n=0;
 const add=(name,category,unit,price,min)=>list.push({id:'gm'+(++n),name,category,unit,price,min,active:true});
 for(const cor of ['Branca','Mogno','Ipê'])for(const size of [60,70,80,90]) add(`Porta lisa ${size} cm – ${cor}`,'Portas','un',size===90?155:135,3);
 for(const cor of ['Branca','Mogno','Ipê'])for(const size of [60,70,80,90]) add(`Porta frisada ${size} cm – ${cor}`,'Portas','un',size===90?170:150,3);
 for(const size of [60,70,80,90])add(`Porta semi-oca ${size} cm`,'Portas','un',size===90?140:125,3);
 add('Porta diagonal','Portas','un',520,2);add('Porta lambri','Portas','un',520,2);add('Porta sete almofadas','Portas','un',520,2);add('Porta de segurança','Portas','un',null,2);
 add('Gesso de revestimento lento – 40 kg','Gesso','saco',22,20);
 add('Gesso intermediário – 50 kg','Gesso','saco',25,20);
 add('Bloco de gesso','Gesso','un',11,100);
 add('Placa de gesso','Gesso','un',4,100);
 add('Corrugado 3/4','Acessórios','un',45,5);
 add('Porta calha','Acessórios','un',160,3);
 add('Argamassa Mac Massa C1','Argamassas','saco',16,10);
 add('Argamassa Ibira C2','Argamassas','saco',30,10);
 add('Argamassa Master Cola','Argamassas','saco',39,10);
 return list;
};
const freshDB=()=>({version:1,products:initCatalog(),stocks:{},moves:[],createdAt:new Date().toISOString()});
let db;
try{db=JSON.parse(localStorage.getItem(DB_KEY))||freshDB();if(!Array.isArray(db.products)||!db.stocks||!Array.isArray(db.moves))throw Error('Dados inválidos');}catch(e){db=freshDB();}
let view='painel',branch='pesqueira',statusFilter='todos',term='',moveType='entrada';
const getProduct=(id)=>db.products.find(p=>p.id===id);
const getStock=(id,b)=>db.stocks[id]?.[b]??null;
const active=()=>db.products.filter(p=>p.active!==false);
const productsSorted=()=>[...active()].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const stockState=(p,b)=>{let x=getStock(p.id,b);return x===null?'nao':x===0?'zero':x<=p.min?'baixo':'bom'};
const save=()=>{try{localStorage.setItem(DB_KEY,JSON.stringify(db));return true}catch(e){toast('Não foi possível salvar. Exporte um backup e confira o espaço do navegador.',true);return false}};
const toast=(msg,error=false)=>{const el=$('toast');el.textContent=msg;el.className='toast show'+(error?' error':'');clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='toast',4200)};
const heading=(tag,title,subtitle,buttons='')=>`<div class="heading"><div><div class="eyebrow">Gesso Mundial • ${escapeHtml(tag)}</div><h1>${escapeHtml(title)}</h1><p class="sub">${escapeHtml(subtitle)}</p></div><div class="controls">${buttons}</div></div>`;
const selectBranch=()=>`<select id="branchSelect" aria-label="Unidade">${BRANCHES.map(b=>`<option value="${b.id}" ${b.id===branch?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}</select>`;
const btn=(label,action,cls='')=>`<button type="button" data-action="${action}" class="btn ${cls}">${label}</button>`;
const headerControls=()=>`${selectBranch()} ${btn('+ Nova movimentação','move','primary')}`;
const badges=(p,b)=>{let status=stockState(p,b),n=getStock(p.id,b);return status==='nao'?'<span class="status wait">Não contado</span>':status==='zero'?'<span class="status zero">Esgotado</span>':status==='baixo'?'<span class="status low">Estoque baixo</span>':'<span class="status good">Em dia</span>'};
function summary(){const list=active(),counted=list.filter(p=>getStock(p.id,branch)!==null),low=counted.filter(p=>stockState(p,branch)==='baixo'||stockState(p,branch)==='zero');return {total:list.length,counted:counted.length,untracked:list.length-counted.length,low,ok:counted.length-low.length}}
function stats(){const s=summary();return `<div class="stat-grid"><div class="stat"><div class="stat-label">Produtos cadastrados <span class="spot"></span></div><strong>${s.total}</strong><small>Catálogo ativo</small></div><div class="stat ok"><div class="stat-label">Saldos conferidos <span class="spot"></span></div><strong>${s.counted}</strong><small>Na unidade selecionada</small></div><div class="stat bad"><div class="stat-label">Estoque baixo ou zerado <span class="spot"></span></div><strong>${s.low.length}</strong><small>Requer atenção</small></div><div class="stat warn"><div class="stat-label">Sem contagem inicial <span class="spot"></span></div><strong>${s.untracked}</strong><small>Precisam de contagem</small></div></div>`}
function notice(){let s=summary();return s.untracked?`<div class="notice warning"><span class="symbol">⚠</span><div><strong>Faça a primeira contagem de ${s.untracked} produto(s) em ${escapeHtml(branchName(branch))}.</strong><p>Os estoques começam como “não contado” — não são quantidades reais. Use <b>Contagem / ajuste</b> para informar o que há na loja, inclusive zero.</p></div></div>`:''}
function recentList(){const rows=db.moves.filter(m=>m.branch===branch||m.toBranch===branch).slice(-6).reverse();return rows.length?`<ul class="clean-list">${rows.map(m=>{const p=getProduct(m.productId);let d=m.type==='entrada'?'+':m.type==='saida'?'−':m.type==='transferencia'?'⇄':'=';return `<li><div class="line-info"><b>${escapeHtml(p?.name||'Produto removido')}</b><small>${escapeHtml(typeLabel(m.type))} • ${fmtDate(m.ts)}</small></div><span class="qty">${d} ${m.quantity} <small class="muted-sm">${escapeHtml(p?.unit||'un')}</small></span></li>`}).join('')}</ul>`:'<div class="empty"><span class="big">↗</span>Nenhuma movimentação registrada ainda.</div>'}
function renderPainel(){const s=summary();const lows=s.low.sort((a,b)=>(getStock(a.id,branch)||0)-(getStock(b.id,branch)||0)).slice(0,7);return heading('Visão geral','Seu estoque, sob controle','Acompanhe os produtos e as movimentações de cada loja.',headerControls())+stats()+notice()+`<div class="section-grid"><section class="panel"><div class="panel-top"><h2>Itens que precisam de reposição</h2><button class="tiny-link" data-nav="estoque" data-filter="baixo">Ver estoque completo</button></div>${lows.length?`<ul class="clean-list">${lows.map(p=>`<li><div class="line-info"><b>${escapeHtml(p.name)}</b><small>Mínimo configurado: ${p.min} ${escapeHtml(p.unit)}</small></div><div style="text-align:right"><div class="qty">${getStock(p.id,branch)} <small class="muted-sm">${escapeHtml(p.unit)}</small></div>${badges(p,branch)}</div></li>`).join('')}</ul>`:`<div class="empty"><span class="big">✓</span>Sem alertas nesta unidade para os itens já contados.</div>`}</section><section class="panel"><div class="panel-top"><h2>Últimas movimentações</h2><button class="tiny-link" data-nav="historico">Ver histórico</button></div>${recentList()}</section></div>`}
function renderEstoque(){let all=productsSorted().filter(p=>p.name.toLowerCase().includes(term.toLowerCase())||p.category.toLowerCase().includes(term.toLowerCase()));let list=all.filter(p=>statusFilter==='todos'||(statusFilter==='baixo'?['baixo','zero'].includes(stockState(p,branch)):statusFilter==='nao'?stockState(p,branch)==='nao':stockState(p,branch)==='bom'));
 const filters=[['todos','Todos'],['baixo','Baixo / zerado'],['nao','Não contados'],['bom','Em dia']].map(([key,lab])=>`<button type="button" class="filter ${statusFilter===key?'active':''}" data-filter="${key}">${lab}</button>`).join('');
 return heading('Saldos','Estoque por produto','Consulte quantidades, faça contagens e registre entradas ou saídas.',headerControls())+notice()+`<div class="toolbar"><input id="searchInput" class="search" type="search" value="${escapeHtml(term)}" placeholder="Buscar produto ou categoria..." aria-label="Pesquisar produtos"><div class="filters">${filters}</div></div><div class="tablebox"><div class="tr head"><span>Produto</span><span>Saldo</span><span>Situação</span><span style="text-align:right">Ações</span></div>${list.map(p=>{let x=getStock(p.id,branch);return `<div class="tr"><div class="product"><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.category)} • Preço venda: ${money(p.price)} • Mín. ${p.min} ${escapeHtml(p.unit)}</small></div><div class="stock-amount"><span class="amount">${x===null?'—':x}</span> <small class="muted-sm">${escapeHtml(p.unit)}</small></div><div>${badges(p,branch)}</div><div class="cell-actions"><button class="btn tiny" data-count="${escapeHtml(p.id)}">Contar</button><button class="btn primary tiny" data-move-id="${escapeHtml(p.id)}">Movimentar</button></div></div>`}).join('')||'<div class="empty">Nenhum produto encontrado para esse filtro.</div>'}</div><p class="footnote">Cada unidade tem sua própria contagem. Os preços cadastrados são referências de venda, e não custos de aquisição.</p>`}
const typeLabel=(t)=>({entrada:'Entrada',saida:'Saída',transferencia:'Transferência',contagem:'Contagem inicial',ajuste:'Ajuste de saldo'}[t]||t);
function stockLine(id,b){let n=getStock(id,b);return n===null?'Não contado':`${n} ${escapeHtml(getProduct(id)?.unit||'un')}`}
function renderMovimentos(){let selectedId=window.selectedProduct||productsSorted()[0]?.id||'';if(!getProduct(selectedId)?.active)selectedId=productsSorted()[0]?.id||'';window.selectedProduct=selectedId;
 return heading('Movimentações','Registrar movimentação','Atualize o saldo com cada compra, venda, transferência ou contagem.',selectBranch())+`<div class="panel card-limit"><div class="kind-switch">${[['entrada','↓ Entrada'],['saida','↑ Saída'],['transferencia','⇄ Transferir'],['contagem','✓ Contar / ajustar']].map(([k,l])=>`<button type="button" data-kind="${k}" class="${moveType===k?'selected':''}">${l}</button>`).join('')}</div><form id="movementForm" class="form-grid"><div class="field full"><label for="mProduct">Produto *</label><select id="mProduct" required>${productsSorted().map(p=>`<option value="${escapeHtml(p.id)}" ${p.id===selectedId?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}</select></div><div class="field"><label for="mBranch">${moveType==='transferencia'?'Origem':'Unidade'}</label><select id="mBranch">${BRANCHES.map(b=>`<option value="${b.id}" ${b.id===branch?'selected':''}>${escapeHtml(b.short)}</option>`).join('')}</select></div>${moveType==='transferencia'?`<div class="field"><label for="mToBranch">Destino</label><select id="mToBranch">${BRANCHES.filter(b=>b.id!==branch).map(b=>`<option value="${b.id}">${escapeHtml(b.short)}</option>`).join('')}</select></div>`:'<div class="field"><label for="mQty">'+(moveType==='contagem'?'Novo saldo contado':'Quantidade')+' *</label><input id="mQty" type="number" min="'+(moveType==='contagem'?'0':'1')+'" step="1" required inputmode="numeric" placeholder="0"></div>'}${moveType==='transferencia'?'<div class="field"><label for="mQty">Quantidade *</label><input id="mQty" type="number" min="1" step="1" required inputmode="numeric" placeholder="0"></div>':''}<div class="field full"><label for="mNote">Observação (opcional)</label><textarea id="mNote" maxlength="250" placeholder="Ex.: Compra do fornecedor, venda no balcão, conferência de mercadoria..."></textarea></div><div class="field full"><div class="note-preview" id="mStockInfo"></div></div><div class="field full"><div class="form-actions" style="margin:0"><button type="submit" class="btn primary">Confirmar ${moveType==='contagem'?'contagem / ajuste':moveType==='transferencia'?'transferência':moveType==='entrada'?'entrada':'saída'}</button><button type="button" class="btn" data-nav="estoque">Voltar ao estoque</button></div></div></form></div><p class="footnote">Para registrar entrada, saída ou transferência é preciso fazer a contagem inicial de cada unidade envolvida.</p>`}
function renderHistorico(){let rows=[...db.moves].reverse().filter(m=>m.branch===branch||m.toBranch===branch);return heading('Auditoria','Histórico de movimentações','Cada entrada, saída, transferência e contagem fica registrada.',`${selectBranch()} ${btn('Exportar CSV','csv-mov','')}`)+`<div class="tablebox"><div class="history-row header-row"><span>Quando / operação</span><span>Produto</span><span>Unidade / detalhes</span><span>Quantidade</span></div>${rows.slice(0,1000).map(m=>{let p=getProduct(m.productId);return `<div class="history-row"><div><span class="type ${escapeHtml(m.type)}">${escapeHtml(typeLabel(m.type))}</span><small>${fmtDate(m.ts)}</small></div><div><b>${escapeHtml(p?.name||'Produto não disponível')}</b><small>${escapeHtml(m.note||'Sem observação')}</small></div><div><b>${escapeHtml(branchName(m.branch))}${m.toBranch?' → '+escapeHtml(branchName(m.toBranch)):''}</b><small>${m.type==='contagem'||m.type==='ajuste'?'Saldo anterior: '+(m.before===null?'Não contado':m.before):'Saldo após: '+m.after}</small></div><div><b>${m.quantity}</b><small>${escapeHtml(p?.unit||'un')}</small></div></div>`}).join('')||'<div class="empty">Nenhuma movimentação registrada nesta unidade.</div>'}</div>${rows.length>1000?'<p class="footnote">Mostrando as 1.000 operações mais recentes. Exporte o CSV para consultar todas.</p>':''}`}
function renderProdutos(){const list=[...db.products].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));return heading('Catálogo','Cadastro de produtos','Organize nomes, categorias, preço de venda e estoque mínimo.',btn('+ Novo produto','new-product','primary'))+`<div class="catalog-grid">${list.map(p=>`<article class="catalog ${p.active===false?'archived':''}"><div><b>${escapeHtml(p.name)}</b><small>${escapeHtml(p.category)} • ${escapeHtml(p.unit)}</small><small>Venda: ${money(p.price)} • Mínimo: ${p.min} ${escapeHtml(p.unit)}</small>${p.active===false?'<span class="status wait">Arquivado</span>':''}</div><div style="display:grid;gap:6px"><button type="button" class="btn tiny" data-edit="${escapeHtml(p.id)}">Editar</button><button type="button" class="btn tiny" data-archive="${escapeHtml(p.id)}">${p.active===false?'Ativar':'Arquivar'}</button></div></article>`).join('')}</div><p class="footnote">Arquivar oculta o produto do estoque e evita perder o histórico de movimentações. Produtos já cadastrados podem ter os preços alterados.</p>`}
function renderDados(){return heading('Segurança','Seus dados e backup','Faça cópias do cadastro e das movimentações para não perder registros.')+`<section class="panel card-limit"><h2>Exportar informações</h2><p class="sub">O backup completo em JSON permite restaurar os dados. O CSV abre no Excel e em outros programas de planilha.</p><div class="settings-actions" style="margin-top:15px">${btn('Baixar backup completo (.json)','backup','primary')}${btn('Estoque em CSV','csv-stock')}${btn('Histórico em CSV','csv-mov')}${btn('Imprimir estoque','print')}</div><hr class="divider"><h2>Restaurar um backup</h2><p class="sub">Escolha um backup .json exportado anteriormente. Ao restaurar, os dados atuais deste navegador serão substituídos.</p><div class="form-actions"><label class="btn dark" for="backupFile" style="cursor:pointer">Selecionar arquivo de backup</label><input type="file" id="backupFile" accept=".json,application/json" style="display:none"></div><hr class="divider"><h2>Como este programa funciona</h2><p class="sub">Ele salva os registros <strong>somente neste navegador</strong>. Não exige login ou internet depois de aberto, mas <strong>não compartilha dados entre aparelhos</strong> e não envia alertas automáticos quando está fechado. Limpar os dados do navegador pode apagar o estoque. Faça backup antes de trocar de aparelho.</p><p class="footnote">Versão inicial 1.0 • Gesso Mundial • Filial Pesqueira e Matriz Cajueiro Seco</p></section>`}
function render(){document.querySelectorAll('#nav [data-nav]').forEach(e=>e.classList.toggle('active',e.dataset.nav===view));$('content').innerHTML=({painel:renderPainel,estoque:renderEstoque,movimentos:renderMovimentos,historico:renderHistorico,produtos:renderProdutos,dados:renderDados}[view]||renderPainel)();if(view==='movimentos')updateMovementInfo()}
function updateMovementInfo(){let node=$('mStockInfo');if(!node)return;const p=$('mProduct').value,b=$('mBranch').value;const n=getStock(p,b),k=moveType;let info=`Saldo atual em ${escapeHtml(branchName(b))}: <strong>${stockLine(p,b)}</strong>. `;if(k==='contagem')info+='Informe a quantidade física que você acabou de contar. Pode ser zero.';else if(n===null)info+='<strong>Faça a contagem inicial antes de movimentar.</strong>';else if(k==='transferencia'){let dest=$('mToBranch')?.value;info+=` Saldo no destino (${escapeHtml(branchName(dest))}): <strong>${stockLine(p,dest)}</strong>.`;if(getStock(p,dest)===null)info+=' <strong>Conte também o estoque do destino antes de transferir.</strong>'}else info+='A quantidade será '+(k==='entrada'?'somada ao':'descontada do')+' saldo.';node.innerHTML=info}
function openProduct(id){const p=getProduct(id);$('dialogTitle').textContent=p?'Editar produto':'Novo produto';$('editId').value=p?.id||'';$('pName').value=p?.name||'';$('pCategory').value=p?.category||'Gesso';$('pUnit').value=p?.unit||'un';$('pPrice').value=p?.price===null||p?.price===undefined?'':String(p.price).replace('.',',');$('pMin').value=p?.min??5;$('productDialog').showModal()}
function validateQty(v,allowZero=false){let n=Number(v);if(!Number.isSafeInteger(n)||n<(allowZero?0:1))throw Error('Informe uma quantidade inteira válida'+(allowZero?' (zero ou maior).':' (maior que zero).'));return n}
function submitMove(e){e.preventDefault();try{const id=$('mProduct').value,p=getProduct(id),b=$('mBranch').value,to=$('mToBranch')?.value||null,q=validateQty($('mQty').value,moveType==='contagem');if(!p||!p.active)throw Error('Selecione um produto ativo.');if(!BRANCHES.some(x=>x.id===b))throw Error('Unidade inválida.');const before=getStock(id,b);let after=before,type=moveType,beforeTo=null,afterTo=null;if(type==='contagem'){after=q;type=before===null?'contagem':'ajuste'}else{if(before===null)throw Error('Faça a contagem inicial dessa unidade antes de movimentar.');if(type==='entrada'){after=before+q}else if(type==='saida'){if(q>before)throw Error('Saída maior que o saldo disponível.');after=before-q}else if(type==='transferencia'){if(b===to||!BRANCHES.some(x=>x.id===to))throw Error('Escolha uma unidade de destino diferente.');beforeTo=getStock(id,to);if(beforeTo===null)throw Error('Faça a contagem inicial do estoque no destino antes de transferir.');if(q>before)throw Error('Transferência maior que o saldo disponível na origem.');after=before-q;afterTo=beforeTo+q}}
 const move={id:uid(),ts:new Date().toISOString(),productId:id,type,branch:b,toBranch:type==='transferencia'?to:null,quantity:q,before,after,beforeTo,afterTo,note:$('mNote').value.trim()};if(!db.stocks[id])db.stocks[id]={};db.stocks[id][b]=after;if(type==='transferencia')db.stocks[id][to]=afterTo;db.moves.push(move);if(save()){toast('Movimentação salva com sucesso.');branch=b;moveType='entrada';view='estoque';statusFilter='todos';term='';render()}}
 catch(err){toast(err.message,true)}}
function csvEscape(v){const s=String(v??'');const safe=/^[=+@\-\t\r]/.test(s)?"'"+s:s;return '"'+safe.replace(/"/g,'""')+'"'}
function download(filename,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function csvDownload(filename,rows){download(filename,'\ufeff'+rows.map(row=>row.map(csvEscape).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function exportStock(){const rows=[['Produto','Categoria','Unidade','Preço venda (R$)','Mínimo',...BRANCHES.map(x=>'Estoque '+x.short)],...db.products.map(p=>[p.name,p.category,p.unit,p.price??'',p.min,...BRANCHES.map(b=>getStock(p.id,b.id)??'Não contado')])];csvDownload('gesso-mundial-estoque.csv',rows);toast('CSV de estoque exportado.')}
function exportMoves(){const rows=[['Data','Tipo','Produto','Unidade','Origem','Destino','Quantidade','Saldo antes','Saldo depois','Observação'],...db.moves.map(m=>[fmtDate(m.ts),typeLabel(m.type),getProduct(m.productId)?.name||'',getProduct(m.productId)?.unit||'',branchName(m.branch),m.toBranch?branchName(m.toBranch):'',m.quantity,m.before??'Não contado',m.after,m.note])];csvDownload('gesso-mundial-movimentacoes.csv',rows);toast('CSV de movimentações exportado.')}
function backup(){download('gesso-mundial-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json;charset=utf-8');toast('Backup baixado. Guarde o arquivo em local seguro.')}
function validBackup(o){if(!o||o.version!==1||!Array.isArray(o.products)||!Array.isArray(o.moves)||typeof o.stocks!=='object'||!o.stocks)return false;if(o.products.length>50000||o.moves.length>500000)return false;const ids=new Set();for(const p of o.products){if(!p||typeof p.id!=='string'||ids.has(p.id)||typeof p.name!=='string'||typeof p.category!=='string'||typeof p.unit!=='string'||!Number.isSafeInteger(p.min)||p.min<0||!(p.price===null||typeof p.price==='number'&&Number.isFinite(p.price)))return false;ids.add(p.id)}for(const [id,values] of Object.entries(o.stocks)){if(!ids.has(id)||!values||typeof values!=='object')return false;for(const b of BRANCHES){const v=values[b.id];if(v!==undefined&&v!==null&&(!Number.isSafeInteger(v)||v<0))return false}}for(const m of o.moves){if(!m||typeof m.productId!=='string'||!ids.has(m.productId)||!BRANCHES.some(x=>x.id===m.branch)||!['entrada','saida','transferencia','contagem','ajuste'].includes(m.type)||!Number.isSafeInteger(m.quantity)||m.quantity<0)return false}return true}
async function importBackup(file){if(!file)return;try{if(file.size>30*1024*1024)throw Error('Backup muito grande.');const imported=JSON.parse(await file.text());if(!validBackup(imported))throw Error('O arquivo não tem o formato esperado de backup da Gesso Mundial.');if(!confirm('IMPORTANTE: substituir todos os dados deste aparelho pelo backup selecionado?'))return;const previous=db;db=imported;if(!save()){db=previous;return}toast('Backup restaurado com sucesso.');view='painel';render()}catch(err){toast('Não foi possível importar: '+err.message,true)}}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){view=nav.dataset.nav;if(nav.dataset.filter)statusFilter=nav.dataset.filter;term='';render();return}
 const filt=e.target.closest('[data-filter]');if(filt){statusFilter=filt.dataset.filter;render();return}
 const count=e.target.closest('[data-count]');if(count){window.selectedProduct=count.dataset.count;moveType='contagem';view='movimentos';render();return}
 const mv=e.target.closest('[data-move-id]');if(mv){window.selectedProduct=mv.dataset.moveId;moveType='entrada';view='movimentos';render();return}
 const kind=e.target.closest('[data-kind]');if(kind){window.selectedProduct=$('mProduct')?.value;moveType=kind.dataset.kind;render();return}
 const edit=e.target.closest('[data-edit]');if(edit){openProduct(edit.dataset.edit);return}
 const archive=e.target.closest('[data-archive]');if(archive){const p=getProduct(archive.dataset.archive);if(p&&confirm((p.active===false?'Ativar':'Arquivar')+' o produto “'+p.name+'”?')){p.active=p.active===false;save();render();toast('Cadastro atualizado.')}return}
 const close=e.target.closest('[data-close]');if(close){$('productDialog').close();return}
 const action=e.target.closest('[data-action]');if(!action)return;
 switch(action.dataset.action){case 'move':view='movimentos';moveType='entrada';render();break;case 'new-product':openProduct(null);break;case 'backup':backup();break;case 'csv-stock':exportStock();break;case 'csv-mov':exportMoves();break;case 'print':window.print();break}
});
document.addEventListener('change',e=>{if(e.target.id==='branchSelect'){branch=e.target.value;render()}else if(e.target.id==='mBranch'){branch=e.target.value;const to=$('mToBranch');if(to){to.innerHTML=BRANCHES.filter(b=>b.id!==branch).map(b=>`<option value="${b.id}">${escapeHtml(b.short)}</option>`).join('')}updateMovementInfo()}else if(e.target.id==='mProduct'){window.selectedProduct=e.target.value;updateMovementInfo()}else if(e.target.id==='mToBranch'){updateMovementInfo()}else if(e.target.id==='backupFile'){importBackup(e.target.files[0]);e.target.value=''}});
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){term=e.target.value;const pos=e.target.selectionStart;render();const search=$('searchInput');search.focus();search.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(e.target.id==='movementForm')submitMove(e);if(e.target.id==='productForm'){e.preventDefault();try{const id=$('editId').value;const typed=$('pPrice').value.trim();const raw=typed.includes(',')?typed.replace(/\./g,'').replace(',','.'):typed;const price=raw===''?null:Number(raw);const min=validateQty($('pMin').value,true);const name=$('pName').value.trim();if(!name)throw Error('Preencha o nome do produto.');if(price!==null&&(!Number.isFinite(price)||price<0))throw Error('Preço inválido.');const category=$('pCategory').value,unit=$('pUnit').value;if(id){const p=getProduct(id);if(!p)throw Error('Produto não encontrado.');Object.assign(p,{name,category,unit,price,min})}else{db.products.push({id:uid(),name,category,unit,price,min,active:true})}if(save()){ $('productDialog').close();toast('Produto salvo.');view='produtos';render()}}catch(err){toast(err.message,true)}}});
window.addEventListener('storage',e=>{if(e.key===DB_KEY&&e.newValue){try{const updated=JSON.parse(e.newValue);if(validBackup(updated)){db=updated;render()}}catch{}}});
render();
</script>
</body>
</html>
